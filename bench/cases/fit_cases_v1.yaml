# (Read the situation, Frame the meaning, Plan the approach, Commit and execute).
# expected = the author's judgement of how the DESCRIBED WORKING STYLE meets each area's day-to-day work: strong | mixed | stretch |
# insufficient (the report is too even to say). These say nothing about ability or qualification.
# LIMITS: labels are author-written, AI-assisted, NOT independently reviewed, and were written by the same person who drafted the area
# profiles, so agreement with the local baseline is partly circular. Treat as a regression and sanity set, not as accuracy evidence.
