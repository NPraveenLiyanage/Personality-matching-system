# Phase 1 development cases for career-area recommendations. ALL SYNTHETIC (invented people, employers, text).
# Expected outcomes were authored with each case from docs/RUBRIC.md and are DESIGN expectations, not expert ratings;
# they need human review before the cases count toward a gate. Split: every case carries `split`; prompts/rules may be tuned
# on `tune` cases only, `holdout` cases are for checking that fixes generalise (do not iterate on them).
#
# supported:   areas a defensible recommendation set should contain (recall target)
# acceptable:  other areas that are reasonable to show (not errors)
# traps:       areas with NO supporting evidence in the CV that would be an unsupported claim if shown as a SUPPORTED
#              recommendation (domain/context confusion). Showing them as clearly labelled exploration is allowed.
# cases_version 2 (2026-10-27, before any evidence-engine run): trap definition fixed as above; all trap lists kept unchanged
#   after review (A024 for the hospital developer and A087/A043 for the lawyer/accountant stay traps: nothing in those CVs
#   supports them). Do not edit traps/supported after looking at evidence-engine output; add new cases instead.
# categories:  failure categories the case probes
