    asha.perera@example.com | +94 77 123 4567

    SUMMARY
    Final-year software engineering student looking for a graduate role in software development.

    EDUCATION
    BSc (Hons) Software Engineering, Northfield Institute of Technology, 2022 - 2026

    PROJECTS
    Hospital Patient Management System (final-year project, 2025)
