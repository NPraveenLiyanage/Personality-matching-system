# Synthetic fixtures set 2 (32 invented CVs, written 2026-10-30). ALL INVENTED: no real person, employer record or dataset text.
# Generation method: for each occupation the task wording was paraphrased from public occupational descriptions (ILO ISCO-08, O*NET
# OnLine, UK National Careers Service job profiles; see `refs` per case and docs/SYNTHETIC_DATA_METHOD.md). Names, employers and dates
# are made up; where an employer name resembles a real one it is coincidence. The references support the plausibility of a task,
# not its occurrence in any real person, and no Sri Lankan licensing rule is inferred from a foreign page.
# Licence notes: ISCO-08 is free to use (ILO FAQ). O*NET content is CC BY 4.0 (attribution: O*NET OnLine, USDOL/ETA; tasks here are
# paraphrased and changed, so they are NOT endorsed by USDOL/ETA). UK National Careers Service pages are used to learn facts, not copied.
# Split "synth_dev_v2": development fixtures, not a held-out set. ALL labels are PROVISIONAL, author-written with AI assistance, and
# NOT reviewed by a human domain specialist. Area membership must be checked against the frozen catalogue_v1 ISCO mapping.
# Expectation fields follow cases v3: supported / acceptable / exploration_only / traps. Do not edit labels after seeing outputs.
# Coverage: 9 students or school leavers, 8 experienced professionals/workers, 5 career changers or old experience, 5 regulated
# occupations, 5 ambiguous/sparse/adversarial.

