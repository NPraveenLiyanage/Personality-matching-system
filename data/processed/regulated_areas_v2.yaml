reviewer_concern:
  A018: 'YES: medicine, MD, registrar, doctor in non-clinical contexts; require positive role/duties and
    check registration separately.'
  A019: 'YES: nursing as subject, nursing app, or ward name; qualifications/registration cannot be validated
    by a word match.'
  A020: 'YES: herbal medicine, traditional medicine and product names are domain mentions, not clinical
    practice.'
  A021: 'YES: ambulance or emergency medical can describe transport or software; require documented care
    tasks.'
  A022: 'YES: veterinary as clinic/product industry; distinguish licensed veterinarian from assistant
    or technician.'
  A023: 'YES: dental, pharmac, therapy prefixes can be product or app contexts; check precise clinical
    role.'
  A024: 'YES: medical technology or biomedical technology can be software/engineering; distinguish technicians
    and regulated roles.'
  A028: 'YES: academic can mean research only; no inference of higher-education teaching without duties.'
  A029: 'YES: instructor, trainer, tutor, teacher are generic across settings.'
  A030: 'YES: education, teacher and teaching alone do not identify school level.'
  A031: 'YES: primary teaching and childcare are distinct occupations with different credential rules.'
  A032: 'YES: education, teacher and curriculum are broad; require specialist activities.'
  A033: 'YES: financial, finance, audit and chartered may be company names/projects. No blanket licensing
    rule for all financial analysts.'
  A046: 'YES: law, legal, LLB are not evidence of admission to practice; separate lawyer, judge and legal
    researcher.'
  A053: 'YES: community worker is vague and legal context alone not paralegal practice.'
  A054: 'YES: security officer may refer to information security; protect against domain/project matches.'
  A068: 'YES: pilot means trial project or TV pilot; seafarer and mariner are vague without operating
    duties.'
note: v1 terms + words the reviewer said were missing. 'Too broad' terms were kept (see reviewer_concern).
