# Occupations that are normally entered through formal qualification or registration. For these areas the backend only accepts a
# direct or transferable claim when a cited evidence record's ROLE or QUALIFICATION SUBJECT matches a term below (matched at a word
# start, case-insensitive). Actions and domain context never satisfy it. This is not a blanket exclusion of industry words: a
# genuine nurse's role ("Staff Nurse") or qualification ("Diploma in Nursing") passes.
# status: draft_unreviewed - term lists need review by a career expert (too broad lets confusions through; too narrow hides
# genuine practitioners such as a nurse whose CV omits the role title).
status: draft_unreviewed
