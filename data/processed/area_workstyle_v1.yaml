version: area_workstyle_v1
status: draft_unreviewed
drafted_by: author (AI-assisted), 2026-10-31
note: What each area's work usually demands, 0-4 per dimension. Author judgement from the area name and ISCO group; NOT reviewed
  or validated. Describes the work, never a person. Needs a human domain reviewer before use in evaluation.
dimensions:
  people: 0 alone or with machines ... 4 constant interaction with people (Extroverted pole)
  abstract: 0 concrete hands-on ... 4 abstract ideas, patterns, models (Intuition pole)
  values: 0 objective technical analysis ... 4 care, values, people-centred judgement (Feeling pole)
  structure: 0 improvised, flexible ... 4 planned, scheduled, procedural (Judging pole)
  pace: 0 slow deliberate decisions ... 4 rapid decisions and hard deadlines
